  db:
    image: postgres:17
    container_name: ${PROJECT_NAME}_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./tmp/postgres:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    restart: unless-stopped
  
  adminer:
    image: adminer
    container_name: ${PROJECT_NAME}_adminer
    restart: unless-stopped
    ports:
      - ${ADMINER_PORT}:8080
