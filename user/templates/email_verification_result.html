<!-- templates/email_verification_result.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Verification</title>
    <meta http-equiv="refresh" content="5;url={{ redirect_url }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9fafb;
            padding: 1rem;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 2.5rem 2rem;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
        }
        .icon.success {
            background: #d1fae5;
        }
        .icon.error {
            background: #fee2e2;
        }
        .icon svg {
            width: 32px;
            height: 32px;
        }
        .icon.success svg {
            stroke: #050796;
        }
        .icon.error svg {
            stroke: #dc2626;
        }
        h1 {
            font-size: 1.25rem;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }
        p {
            color: #6b7280;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        #countdown {
            font-weight: 600;
            color: #050796;
        }
        a.button {
            display: inline-block;
            background: #050796;
            color: white;
            text-decoration: none;
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .redirect-text {
            font-size: 0.85rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="card">
        {% if success %}
            <div class="icon success">
                <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h1>Email Verified!</h1>
        {% else %}
            <div class="icon error">
                <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </div>
            <h1>Verification Failed</h1>
        {% endif %}

        <p>{{ message }}</p>

        <p class="redirect-text">
            Redirecting to login in <span id="countdown">5</span> seconds...
        </p>

        <a href="{{ redirect_url }}" class="button">Go to Login Now</a>
    </div>

    <script>
        let seconds = 5;
        const countdownEl = document.getElementById('countdown');
        const timer = setInterval(() => {
            seconds -= 1;
            countdownEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = "{{ redirect_url }}";
            }
        }, 1000);
    </script>
</body>
</html>
